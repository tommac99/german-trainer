<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deutsch üben</title>
<meta name="theme-color" content="#f5efe3">
<style>
  :root {
    --paper:#f5efe3; --card:#fffdf8; --ink:#1f2430; --muted:#6a6355; --line:#e4d9c4; --line-strong:#cdbfa2;
    --accent:#2a4fb8; --accent-soft:#e8eefc; --nom:#2a4fb8; --akk:#d4443b; --dat:#23875a; --gen:#c68a10;
    --ok:#1b7a4b; --okbg:#e2f3e9; --bad:#b3261e; --badbg:#fbe8e5; --muted-bg:#efe7d6;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:"Avenir Next","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
    --shadow:0 1px 0 rgba(120,95,40,.12),0 8px 24px -12px rgba(80,55,10,.22);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; font:17px/1.55 var(--sans); color:var(--ink); background-color:var(--paper);
    background-image:
      radial-gradient(1100px 500px at 8% -10%, rgba(42,79,184,.07), transparent 60%),
      radial-gradient(900px 480px at 100% 0%, rgba(212,68,59,.06), transparent 60%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .36  0 0 0 0 .2  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    background-attachment:fixed;
  }
  .cN { color:var(--nom); } .cA { color:var(--akk); } .cD { color:var(--dat); }
  ::selection { background:#ffe28a; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; border-radius:8px; }

  nav {
    display:flex; align-items:center; flex-wrap:wrap; gap:6px; padding:10px 20px;
    position:sticky; top:0; z-index:2; background:rgba(245,239,227,.88);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  }
  .brand { font:700 20px var(--serif); display:flex; align-items:center; gap:3px; margin-right:auto; letter-spacing:.2px; }
  .brand i { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .brand i:nth-child(1) { background:var(--nom); } .brand i:nth-child(2) { background:var(--akk); } .brand i:nth-child(3) { background:var(--dat); margin-right:8px; }
  nav button {
    font:600 15px var(--sans); padding:7px 14px; border:0; border-radius:999px; background:transparent;
    color:var(--muted); cursor:pointer; transition:background .15s,color .15s;
  }
  nav button:hover { background:var(--muted-bg); color:var(--ink); }
  nav button.on { background:var(--ink); color:#fff8e8; }
  nav button .en { color:inherit; opacity:.65; font-size:13px; }

  main { max-width:860px; margin:0 auto; padding:28px 18px 90px; }
  h1, h2, h3, h4 { font-family:var(--serif); line-height:1.15; color:var(--ink); }
  h1 { font-size:clamp(34px,6vw,46px); margin:6px 0 14px; letter-spacing:-.4px; }
  h1::after {
    content:""; display:block; width:96px; height:5px; margin-top:12px; border-radius:3px;
    background:linear-gradient(90deg,var(--nom) 0 25%,var(--akk) 25% 50%,var(--dat) 50% 75%,var(--gen) 75%);
  }
  h2 { font-size:24px; margin:40px 0 12px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  h2::before { content:""; align-self:center; width:8px; height:22px; border-radius:4px; background:var(--accent); }
  h2:nth-of-type(4n+2)::before { background:var(--akk); }
  h2:nth-of-type(4n+3)::before { background:var(--dat); }
  h2:nth-of-type(4n)::before { background:var(--gen); }
  h4 { font-size:18px; margin:22px 0 4px; }
  p { margin:8px 0; }
  .en { color:var(--muted); font-weight:400; font-family:var(--sans); font-size:.82em; }
  h1 .en, h2 .en { font-size:.6em; }

  table {
    width:100%; border-collapse:separate; border-spacing:0; background:var(--card); margin:10px 0 18px; font-size:15.5px;
    border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow);
  }
  th, td { padding:8px 12px; text-align:left; vertical-align:top; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
  th:last-child, td:last-child { border-right:0; }
  tr:last-child td { border-bottom:0; }
  th { background:var(--muted-bg); font:700 12.5px var(--sans); letter-spacing:.06em; text-transform:uppercase; color:#54482f; }
  tr:nth-child(even) td { background:#fdf8ec; }
  .ex { margin:6px 0; }

  .box {
    background:#fff6d9; border:1px solid #ecd48a; border-left:6px solid var(--gen);
    padding:6px 18px; border-radius:6px 14px 14px 6px; margin:14px 0; box-shadow:var(--shadow);
  }

  .card {
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px;
    display:flex; flex-direction:column; gap:2px; box-shadow:var(--shadow); position:relative;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card b { font:700 18px var(--serif); }
  .card small { margin-top:4px; }
  .topics .card { border-top:5px solid var(--accent); }
  .topics .card:nth-child(4n+2) { border-top-color:var(--akk); }
  .topics .card:nth-child(4n+3) { border-top-color:var(--dat); }
  .topics .card:nth-child(4n) { border-top-color:var(--gen); }
  .topics .card:hover { transform:translateY(-3px); box-shadow:0 1px 0 rgba(120,95,40,.12),0 16px 28px -14px rgba(80,55,10,.35); }
  .topics { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
  .modes { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; margin:12px 0; }
  .modes button {
    text-align:left; padding:18px 20px; font:inherit; border:2px solid var(--ink); border-radius:16px;
    background:var(--card); cursor:pointer; box-shadow:5px 5px 0 var(--ink); transition:transform .12s,box-shadow .12s;
  }
  .modes button:nth-child(2) { box-shadow:5px 5px 0 var(--akk); border-color:var(--akk); }
  .modes button:hover { transform:translate(-2px,-2px); box-shadow:7px 7px 0 var(--ink); }
  .modes button:nth-child(2):hover { box-shadow:7px 7px 0 var(--akk); }
  .modes button:active { transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }
  .modes button b { font:700 20px var(--serif); }
  small { display:block; color:var(--muted); font-size:14px; line-height:1.4; }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:12px; }

  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips a { font-size:14px; padding:3px 12px; border:1px solid var(--line); border-radius:999px; text-decoration:none; color:var(--ink); background:var(--card); }
  .chips a:hover { border-color:var(--accent); color:var(--accent); }

  button.small, .next {
    font:600 15px var(--sans); padding:8px 16px; border:2px solid var(--accent); border-radius:999px;
    background:var(--accent); color:#fff; cursor:pointer; transition:transform .12s,background .12s,box-shadow .12s;
  }
  button.small:hover, .next:hover { transform:translateY(-1px); box-shadow:0 6px 14px -6px rgba(42,79,184,.6); }
  .next { margin:14px 8px 0 0; padding:11px 26px; font-size:16px; }
  button.ghost, .next.ghost { background:transparent; color:var(--accent); font:600 15px var(--sans); border:2px solid var(--accent); padding:8px 16px; border-radius:999px; cursor:pointer; }
  .next.ghost { padding:11px 26px; font-size:16px; }
  button.ghost:hover { background:var(--accent-soft); box-shadow:none; }
  button.danger { color:var(--bad); border-color:var(--bad); }
  button.danger:hover { background:var(--badbg); }

  .bar { height:10px; background:var(--muted-bg); border-radius:6px; overflow:hidden; margin:10px 0 6px; box-shadow:inset 0 1px 2px rgba(80,55,10,.18); }
  .bar i { display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--nom),var(--dat)); transition:width .5s cubic-bezier(.2,.8,.2,1); }
  .meta { display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-size:14.5px; flex-wrap:wrap; }

  .ask { margin-top:22px; color:var(--muted); font:600 12.5px var(--sans); letter-spacing:.08em; text-transform:uppercase; }
  .q { font:600 clamp(26px,5vw,36px)/1.28 var(--serif); margin:8px 0 4px; letter-spacing:-.2px; }
  .q mark { background:linear-gradient(transparent 55%,#ffd75e 55%); padding:0 3px; color:inherit; }
  .trans { margin-bottom:14px; font-size:17px; color:var(--muted); font-style:italic; }
  .opts { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-top:14px; }
  .opts button {
    font:600 19px var(--serif); padding:14px 16px; border:2px solid var(--line); border-radius:14px; background:var(--card);
    color:var(--ink); cursor:pointer; text-align:left; display:flex; align-items:center; gap:12px;
    box-shadow:0 3px 0 var(--line); transition:transform .12s,border-color .12s,box-shadow .12s,background .12s;
  }
  .opts button:hover:not(:disabled) { border-color:var(--accent); transform:translateY(-2px); box-shadow:0 5px 0 var(--accent); }
  .opts button:active:not(:disabled) { transform:translateY(1px); box-shadow:0 1px 0 var(--accent); }
  .opts button:disabled { cursor:default; color:inherit; }
  .opts button.ok { border-color:var(--ok); background:var(--okbg); box-shadow:0 3px 0 var(--ok); }
  .opts button.bad { border-color:var(--bad); background:var(--badbg); box-shadow:0 3px 0 var(--bad); }
  .opts kbd {
    flex:none; display:inline-grid; place-items:center; width:26px; height:26px; border-radius:7px;
    background:var(--muted-bg); border:1px solid var(--line-strong,#cdbfa2); color:var(--muted); font:700 13px var(--sans); margin:0;
  }
  .opts button.ok kbd { background:var(--ok); border-color:var(--ok); color:#fff; }
  .opts button.bad kbd { background:var(--bad); border-color:var(--bad); color:#fff; }

  .fb { margin-top:18px; padding:14px 18px; border-radius:14px; border-left:6px solid; }
  .fb.ok { background:var(--okbg); border-color:var(--ok); } .fb.bad { background:var(--badbg); border-color:var(--bad); }
  details.lesson { margin-top:14px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 18px; box-shadow:var(--shadow); }
  details.lesson summary { cursor:pointer; font:700 16px var(--serif); }
  details.lesson[open] summary { margin-bottom:6px; }

  .tag { display:inline-block; font-size:12.5px; font-weight:600; background:var(--muted-bg); border-radius:999px; padding:1px 10px; margin-left:6px; color:#54482f; }
  .tiles { display:flex; gap:12px; flex-wrap:wrap; margin:14px 0; }
  .tiles div { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 20px; display:flex; flex-direction:column; box-shadow:var(--shadow); min-width:110px; }
  .tiles b { font:700 32px var(--serif); line-height:1.1; } .tiles span { color:var(--muted); font-size:13.5px; }
  .words details, .words .w { border-bottom:1px solid var(--line); padding:8px 0; } .words summary { cursor:pointer; }

  input, select { font:inherit; font-size:16px; padding:7px 12px; border:2px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); }
  input:focus, select:focus, textarea:focus { border-color:var(--accent); outline:none; }
  textarea { width:100%; margin-top:12px; font:14px/1.45 ui-monospace,Menlo,monospace; padding:12px; border:2px solid var(--line); border-radius:12px; background:var(--card); }

  @media (prefers-reduced-motion:no-preference) {
    @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
    @keyframes shake { 20%,60% { transform:translateX(-5px); } 40%,80% { transform:translateX(5px); } }
    #menu > *, #round > * { animation:rise .5s cubic-bezier(.2,.8,.2,1) both; }
    #menu > *:nth-child(2) { animation-delay:.05s; } #menu > *:nth-child(3) { animation-delay:.1s; }
    #menu > *:nth-child(n+4) { animation-delay:.15s; }
    .topics .card { animation:rise .5s cubic-bezier(.2,.8,.2,1) both; }
    .topics .card:nth-child(2) { animation-delay:.04s; } .topics .card:nth-child(3) { animation-delay:.08s; }
    .topics .card:nth-child(4) { animation-delay:.12s; } .topics .card:nth-child(n+5) { animation-delay:.16s; }
    .opts button.bad { animation:shake .35s; }
  }
  @media (max-width:560px) {
    nav { padding:8px 12px; } .brand { width:100%; margin-bottom:2px; }
    main { padding:20px 14px 80px; } th, td { padding:6px 8px; font-size:14px; }
    .modes button { box-shadow:4px 4px 0 var(--ink); }
  }
  @media print {
    nav, .noprint, #practice, #notes, #words, #range, label { display:none !important; }
    #progress { display:block !important; } body { font-size:12pt; background:#fff; }
    .card, table, .tiles div { box-shadow:none; }
  }
</style>
</head>
<body>
<nav>
  <span class="brand"><i></i><i></i><i></i>Deutsch üben</span>
  <button data-act="tab" data-tab="practice" class="on">Üben <span class="en">(practice)</span></button>
  <button data-act="tab" data-tab="words">Wörter <span class="en">(words)</span></button>
  <button data-act="tab" data-tab="notes">Notizen <span class="en">(notes)</span></button>
  <button data-act="tab" data-tab="progress">Fortschritt <span class="en">(progress)</span></button>
</nav>
<main id="practice"><div id="menu"></div><div id="round" hidden></div></main>
<main id="words" hidden></main>
<main id="notes" hidden></main>
<main id="progress" hidden></main>
<script src="data/base.js"></script>
<script src="data/latest.js"></script>
<script src="data/verbs.js"></script>
<script src="data/cases.js"></script>
<script src="data/review.js"></script>
<script src="data/words-a1.js"></script>
<script src="data/words-a2.js"></script>
<script src="data/words-b1.js"></script>
<script src="data/words-b2.js"></script>
<script src="vocab.js"></script>
<script src="app.js"></script>
</body>
</html>
